name: Ascend

# project.yml is the source of truth for the Xcode project; Ascend.xcodeproj is generated and
# gitignored. Regenerate with `xcodegen generate` after adding files.
options:
  bundleIdPrefix: com.foggylulu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AscendCore:
    path: Packages/AscendCore

targets:
  Ascend:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Ascend
        # Agent tooling in this environment drops .claude-flow / .swarm directories into
        # source folders. XcodeGen would otherwise bundle their JSON as app resources, and two
        # of them collide on the same filename -- "Multiple commands produce state.json".
        excludes:
          - "**/.claude-flow/**"
          - "**/.swarm/**"
          - "**/.DS_Store"
    dependencies:
      # All three layers, because the app is the only place allowed to know about all of
      # them: it wires the engine to the generator and hands both to the views.
      - package: AscendCore
        product: AscendDomain
      - package: AscendCore
        product: AscendPersistence
      - package: AscendCore
        product: AscendIntelligence
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: Ascend/Info.plist
      properties:
        CFBundleDisplayName: Ascend
        UILaunchScreen:
          UIColorName: PrimaryBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foggylulu.Ascend
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.3"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Main-actor by default, so views and view models need no @MainActor annotations. The
        # package does NOT inherit this: AscendDomain's pure value types must stay
        # nonisolated, and only AscendPersistence opts in (see Package.swift).
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CLANG_WARN_DOCUMENTATION_COMMENTS: YES
        CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
        GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
