# The checks live in tools/check.sh so they can be run without GitHub:
#
#     tools/check.sh
#
# The app target is deliberately absent. Building it needs Xcode 26 and the iOS 26
# SDK, and pinning this workflow to a runner image that may not have them buys a
# red badge that says nothing about the code. check.sh skips xcodebuild when it is
# unavailable and the README states the command for a local check instead.
#
# What does run here is the part worth running: the whole game engine, the palette,
# and the architecture guards — no simulator, no Apple Intelligence, under a second.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: tools/check.sh
    # macOS because AscendCore targets macOS 26 so that SwiftData and
    # FoundationModels can be compiled and tested without a simulator.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Run the same script a contributor runs
        env:
          SKIP_XCODEBUILD: "1"
        run: tools/check.sh
